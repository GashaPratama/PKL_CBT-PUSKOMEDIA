<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Siswa (Offline)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 via-white to-purple-100 min-h-screen font-sans">
  <div class="max-w-4xl mx-auto bg-white mt-6 mb-8 px-6 py-6 sm:p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">📴 Mode Offline - Ujian Tersimpan</h2>
    <div id="ujian-list" class="space-y-6">
      <!-- Diisi via JS -->
    </div>
    <p class="text-center text-sm text-gray-400 mt-10">🔌 Sambungkan internet untuk mengakses semua fitur.</p>
  </div>

  <script>
    const secretKey = 'kunc!_rahasia123';

    function ambilUjianTersimpan() {
      const ujianList = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith("ujian_") && key.endsWith("_data")) {
          const ujianId = key.split("_")[1];
          try {
            const encrypted = localStorage.getItem(key);
            const decrypted = CryptoJS.AES.decrypt(encrypted, secretKey).toString(CryptoJS.enc.Utf8);
            const data = JSON.parse(decrypted);
            ujianList.push({ id: ujianId, data });
          } catch (e) {
            console.warn("❌ Gagal dekripsi:", key);
          }
        }
      }
      return ujianList;
    }

    function tampilkanUjian() {
      const container = document.getElementById("ujian-list");
      const daftar = ambilUjianTersimpan();

      if (daftar.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-center">Tidak ada ujian yang tersimpan di perangkat.</p>`;
        return;
      }

      daftar.forEach((item, idx) => {
        const { id, data } = item;
        const sudahJawab = localStorage.getItem(`jawaban_ujian_${id}`);
        const waktu = new Date(data.ujian?.jadwal_mulai || Date.now()).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        const html = `
          <div class="border border-gray-300 rounded-lg p-4 shadow-sm bg-white">
            <div class="flex justify-between items-center mb-2">
              <h3 class="text-lg font-semibold text-gray-800">${data.ujian?.nama || 'Ujian Tanpa Nama'}</h3>
              <span class="text-sm text-gray-600">${new Date(data.ujian?.jadwal_mulai).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
            </div>
            <div class="text-sm text-gray-600 mb-3">
              🕐 ${waktu} WIB | ⏳ ${data.ujian?.durasi || '-'} menit
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="mulaiUjian(${id})"
                class="px-4 py-2 text-sm rounded text-white font-medium ${sudahJawab ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}"
                ${sudahJawab ? 'disabled' : ''}>
                ${sudahJawab ? '✅ Sudah Dikerjakan' : '📝 Kerjakan'}
              </button>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    function mulaiUjian(id) {
      const data = localStorage.getItem(`ujian_${id}_data`);
      if (!data) {
        alert("❌ Soal tidak ditemukan. Tidak dapat memulai ujian.");
        return;
      }
      // Redirect ke halaman ujian offline
      window.location.href = `/siswa/ujian/${id}`;
    }

    // Init
    document.addEventListener('DOMContentLoaded', tampilkanUjian);
  </script>
</body>
</html>
